# Searchlight (⌘-Space, see compositor/src/input.c): fuzzel in Platinum
# colours, grey box, black text, the highlight's blue.
[main]
prompt="Searchlight: "
font=DejaVu Sans:size=11
width=50
lines=10
terminal=xfce4-terminal -x
[colors]
background=ddddddff
text=000000ff
match=000000ff
selection=3366ccff
selection-text=ffffffff
selection-match=ffffffff
border=000000ff
[border]
width=1
radius=4
